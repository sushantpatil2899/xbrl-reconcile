# Companies to ingest. Any key under `defaults` can be overridden per company.
# Facts SEC already provides (fiscal year end, former names, industry code)
# are read from SEC data and are not repeated here.

defaults:
  start_year: 2009
  end_year: null
  enabled: true
  report_types: [10-K, 10-K/A, 10-Q, 10-Q/A, 20-F, 20-F/A]

companies:
