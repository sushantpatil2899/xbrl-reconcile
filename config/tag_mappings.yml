# How raw SEC tags become canonical concepts.
#
# Order inside `tags` is the priority: the first tag a company reports for a
# period wins. A tag is only listed when it means the concept itself. Component
# tags (a part of a total) are deliberately absent rather than ranked last,
# because a tag ranked last still wins whenever nothing above it matches.
#
# Confidence here means "standard tag, used consistently across the sector",
# not "verified against the filing's own arithmetic". Phase 6 will check
# mappings against each filing's calculation linkbase and can upgrade or
# contradict these.
#
#   high    the standard tag for this total, or a valid alternative form
#   medium  a tag retired by a rule change, or a different reporting basis
#   low     a judgement call, to be documented in its note
#
# ifrs-full tags are ranked last because they follow different accounting
# rules. Only Atlassian reports them, for periods ending 2016 to 2018.
#
# `additive: false` marks a concept whose periods cannot be added or subtracted,
# which is how a ratio or an average differs from a sum. Concepts are additive
# unless stated, so a new ratio concept must say so or a quarter derived from it
# will be quietly wrong.

concepts:
  revenue:
    statement: income_statement
    unit: USD
    tags:
      - { tag: "us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax", confidence: high }
      - { tag: "us-gaap:RevenueFromContractWithCustomerIncludingAssessedTax", confidence: high, note: "Used by CrowdStrike" }
      - { tag: "us-gaap:Revenues", confidence: high }
      - { tag: "us-gaap:SalesRevenueNet", confidence: medium, note: "Retired in 2018 when ASC 606 took effect" }
      - { tag: "ifrs-full:Revenue", confidence: medium }
      - { tag: "ifrs-full:RevenueFromContractsWithCustomers", confidence: medium, note: "The IFRS 15 form, which Atlassian used from 2019. It reported both tags for 2017 and 2018 during the transition, the same shape ASC 606 produced for US filers" }

  cost_of_revenue:
    statement: income_statement
    unit: USD
    tags:
      - { tag: "us-gaap:CostOfRevenue", confidence: high }
      - { tag: "us-gaap:CostOfGoodsAndServicesSold", confidence: high }
      - { tag: "ifrs-full:CostOfSales", confidence: medium }
    # Filers without a total tag report cost of revenue as two parts. Intuit
    # reported 677 million of services plus 120 million of goods for 2017 and
    # never tagged the 797 million total, so either part alone understates it.
    # Used only when no tag above matched, and only when both parts are present.
    components:
      - tags: ["us-gaap:CostOfServices", "us-gaap:CostOfGoodsSold"]
        confidence: medium

  gross_profit:
    statement: income_statement
    unit: USD
    tags:
      - { tag: "us-gaap:GrossProfit", confidence: high }
      - { tag: "ifrs-full:GrossProfit", confidence: medium }

  operating_expenses:
    statement: income_statement
    unit: USD
    # Operating expenses excluding cost of revenue. us-gaap:CostsAndExpenses is
    # deliberately absent: it includes cost of revenue, so it is a different
    # measure. Intuit reports only that, so its operating expenses are derived.
    tags:
      - { tag: "us-gaap:OperatingExpenses", confidence: high }
      - { tag: "ifrs-full:OperatingExpense", confidence: medium }

  operating_income:
    statement: income_statement
    unit: USD
    tags:
      - { tag: "us-gaap:OperatingIncomeLoss", confidence: high }
      - { tag: "ifrs-full:ProfitLossFromOperatingActivities", confidence: medium }

  net_income:
    statement: income_statement
    unit: USD
    tags:
      - { tag: "us-gaap:NetIncomeLoss", confidence: high }
      - { tag: "us-gaap:ProfitLoss", confidence: medium, note: "Includes noncontrolling interests" }
      - { tag: "ifrs-full:ProfitLossAttributableToOwnersOfParent", confidence: medium }

  eps_diluted:
    statement: income_statement
    unit: USD/shares
    # A ratio, so its periods cannot be added or subtracted: each figure has its
    # own share count underneath it. A fourth quarter cannot be recovered by
    # taking the nine month figure off the full year one.
    additive: false
    tags:
      - { tag: "us-gaap:EarningsPerShareDiluted", confidence: high }
      - { tag: "us-gaap:EarningsPerShareBasicAndDiluted", confidence: medium, note: "Used when basic and diluted are equal, which happens in loss making periods" }
      - { tag: "ifrs-full:DilutedEarningsLossPerShare", confidence: medium }

  shares_diluted:
    statement: income_statement
    unit: shares
    # A weighted average over the period, and subtracting one average from
    # another is not an average of anything.
    additive: false
    tags:
      - { tag: "us-gaap:WeightedAverageNumberOfDilutedSharesOutstanding", confidence: high }
      - { tag: "us-gaap:WeightedAverageNumberOfShareOutstandingBasicAndDiluted", confidence: medium, note: "Combined count, used when basic and diluted are equal. Note the singular Share in the tag name" }
      - { tag: "ifrs-full:AdjustedWeightedAverageShares", confidence: medium }

  total_assets:
    statement: balance_sheet
    unit: USD
    tags:
      - { tag: "us-gaap:Assets", confidence: high }
      - { tag: "ifrs-full:Assets", confidence: medium }

  total_liabilities:
    statement: balance_sheet
    unit: USD
    # LiabilitiesAndStockholdersEquity is absent: it equals total assets, not
    # total liabilities. Autodesk reports only that, so its total liabilities
    # have no mapping and appear in the coverage report.
    tags:
      - { tag: "us-gaap:Liabilities", confidence: high }
      - { tag: "ifrs-full:Liabilities", confidence: medium }

  total_equity:
    statement: balance_sheet
    unit: USD
    # Total equity means all equity, including the part belonging to
    # noncontrolling interests, because that is what balances against total
    # assets. GitLab's JiHu joint venture is 45 million of its equity, and
    # picking the parent only tag left the balance sheet short by exactly that.
    tags:
      - { tag: "us-gaap:StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest", confidence: high }
      - { tag: "us-gaap:StockholdersEquity", confidence: high, note: "Parent only, which equals total equity when there is no noncontrolling interest" }
      - { tag: "ifrs-full:Equity", confidence: medium }

  # Redeemable convertible preferred stock sits between liabilities and equity,
  # because it is neither: it can be redeemed, so it is not permanent capital.
  # Pre IPO companies carry large amounts of it, which is why their equity looks
  # deeply negative. Without this concept the balance sheet does not balance.
  temporary_equity:
    statement: balance_sheet
    unit: USD
    # Most companies have no redeemable preferred stock, so its absence is an
    # answer rather than a coverage gap. Only 20 of the 28 report it in any year.
    optional: true
    tags:
      - { tag: "us-gaap:TemporaryEquityCarryingAmountAttributableToParent", confidence: high }
      - { tag: "us-gaap:TemporaryEquityCarryingAmountIncludingPortionAttributableToNoncontrollingInterests", confidence: medium, note: "Includes noncontrolling interests" }
      - { tag: "us-gaap:TemporaryEquityCarryingAmount", confidence: medium, note: "The single tag used before 2013, when SEC split it into the parent and noncontrolling variants above. Its absence left three Salesforce balance sheets short by exactly the redeemable preferred stock they reported" }

  cash:
    statement: balance_sheet
    unit: USD
    tags:
      - { tag: "us-gaap:CashAndCashEquivalentsAtCarryingValue", confidence: high }
      - { tag: "ifrs-full:CashAndCashEquivalents", confidence: medium }

  operating_cash_flow:
    statement: cash_flow
    unit: USD
    tags:
      - { tag: "us-gaap:NetCashProvidedByUsedInOperatingActivities", confidence: high }
      - { tag: "us-gaap:NetCashProvidedByUsedInOperatingActivitiesContinuingOperations", confidence: medium, note: "Excludes discontinued operations" }
      - { tag: "ifrs-full:CashFlowsFromUsedInOperatingActivities", confidence: medium }

  investing_cash_flow:
    statement: cash_flow
    unit: USD
    tags:
      - { tag: "us-gaap:NetCashProvidedByUsedInInvestingActivities", confidence: high }
      - { tag: "us-gaap:NetCashProvidedByUsedInInvestingActivitiesContinuingOperations", confidence: medium, note: "Excludes discontinued operations" }
      - { tag: "ifrs-full:CashFlowsFromUsedInInvestingActivities", confidence: medium }

  financing_cash_flow:
    statement: cash_flow
    unit: USD
    tags:
      - { tag: "us-gaap:NetCashProvidedByUsedInFinancingActivities", confidence: high }
      - { tag: "us-gaap:NetCashProvidedByUsedInFinancingActivitiesContinuingOperations", confidence: medium, note: "Excludes discontinued operations" }
      - { tag: "ifrs-full:CashFlowsFromUsedInFinancingActivities", confidence: medium }

# Axes whose members partition whatever they break down, so summing them
# recovers a total the company never tagged. This is a claim about the axis, not
# about any one concept: if an axis has a member that is itself a total, or
# members that overlap, summing it would double count and it must not be listed.
summable_axes:
  - axis: ProductOrService
    confidence: medium
    note: >
      Filers split income statement lines into product and service components
      that add to the reported total. Workday reports cost of revenue only as
      SubscriptionServices plus ProfessionalServices, and Intuit only as Service
      plus ProductAndOther.

company_overrides:
  # Every override below is bounded by year, and the bounds are not cosmetic. A tag
  # can be a total for one filer in one year and a component for the same filer in
  # another, and the filings' own calculation linkbases say which. Salesforce declares
  # CostOfServices a child of CostOfRevenue in its 2010 to 2013 filings, and a child
  # of GrossProfit from 2015, so it is a component in the first window and the cost
  # line itself in the second. An unbounded override would corrupt the years that are
  # already right.
  - cik: 1108524
    concept: cost_of_revenue
    prefer: ["us-gaap:CostOfServices"]
    confidence: medium
    from_year: 2015
    through_year: 2016
    note: >
      Salesforce tagged no cost of revenue total for these two years, leaving the
      line empty while gross profit was reported. It labels this tag "Total cost of
      revenues" on its own income statement, and its linkbase places the tag directly
      under GrossProfit rather than under CostOfRevenue. Revenue 5,373.586 less
      1,289.270 is 4,084.316, the gross profit it reported, exactly. The 2010 to 2013
      filings use the same tag as a component, which is why this stops at 2016.

  - cik: 1660134
    concept: cost_of_revenue
    prefer: ["us-gaap:CostOfServices"]
    confidence: medium
    from_year: 2016
    through_year: 2016
    note: >
      Okta's first reported year, labelled "Total cost of revenue" by Okta itself.
      Revenue 85.907 less 36.024 is 49.883, the gross profit it reported, exactly.
      From 2017 it tags CostOfGoodsAndServicesSold, which needs no override.

  - cik: 1660134
    concept: revenue
    prefer: ["us-gaap:SalesRevenueServicesNet"]
    confidence: medium
    from_year: 2016
    through_year: 2016
    note: >
      The same year and the same statement, where Okta labels this tag "Total
      revenue". Both halves of that income statement were missing for want of two
      tags retired by ASC 606.

  - cik: 1650372
    concept: revenue
    prefer: ["ifrs-full:RevenueFromContractsWithCustomers"]
    confidence: medium
    from_year: 2019
    through_year: 2020
    note: >
      Atlassian stopped tagging ifrs-full:Revenue after 2018 and reported only the
      IFRS 15 form, so these two years had no revenue at all. 1,210.127 and 1,614.173
      respectively. Its 2021 move to US GAAP needs no override.

  - cik: 1327811
    concept: cost_of_revenue
    sum:
      - "custom:CostOfRevenueSubscriptionAndSupport"
      - "us-gaap:TechnologyServicesCosts"
    confidence: medium
    from_year: 2014
    through_year: 2016
    note: >
      Workday reported cost of revenue as two lines with no total for these years,
      labelled "Costs of subscription services" and "Costs of professional services"
      on its own income statement. One of the two is a custom tag, which the
      companyfacts API drops entirely, so the pair is summed from the Data Sets.
      The evidence is unusually strong: the same pair reproduces the published total
      exactly in four other years, by two unrelated mechanisms. 2012 and 2013 sum to
      65.368 and 116.535, which is what Workday tagged as CostOfRevenue, and 2017 and
      2018 sum to 483.545 and 629.413, which is what the dimension recovery produces.
      Those four bracket the three gap years on both sides. Bounded to 2014 to 2016
      because a reported total exists outside that window and should win.

  - cik: 1327811
    concept: operating_expenses
    ignore: ["us-gaap:OperatingExpenses"]
    note: >
      Workday uses this tag for a different concept than everyone else, and its own
      presentation label says so: it reads "Total costs and expenses" on Workday's
      income statement and "Total operating expenses" on Adobe's, Autodesk's,
      Salesforce's and every other filer's. Workday's figure therefore includes cost
      of revenue, which this concept excludes, so it overstated operating expenses by
      exactly the cost of revenue in all 13 annual years and 92 published values.
      Ignoring the tag leaves the value to be derived from revenue less cost of
      revenue less operating income. That covers 70 of the 92; the other 22 are
      periods where cost of revenue is itself missing, and they become gaps, which is
      the honest outcome because the published figures were wrong.

  - cik: 1353283
    concept: net_income
    prefer: ["us-gaap:NetIncomeLossAvailableToCommonStockholdersBasic"]
    confidence: medium
    note: >
      Splunk reports no NetIncomeLoss. This tag is net income after preferred
      dividends, and Splunk reports zero preferred shares outstanding in every
      year, so the two are equal.

# Corrections to the scale a filer tagged a value at.
#
# Not a mapping: the tag is right and the number is out by a factor. XBRL carries a
# `decimals` attribute saying what a figure is rounded to, but companyfacts does not
# expose it, so a scale error arrives looking like an ordinary number.
#
# Scoped by accession, because that is the grain the error has. HubSpot tagged three
# 10-Qs in thousands while the 10-K filed between two of them is in units, so neither
# a fiscal year nor a filed date window separates them. Where a filing is mixed, a
# period bound narrows it further.
#
# Every entry is checkable against the document it names, and the share scale test
# still runs afterwards, so an override that misses or overshoots shows up as a
# failure rather than as silence.
scale_overrides:
  - cik: 1404655
    concept: shares_diluted
    multiply_by: 1000
    accessions:
      - "0001564590-15-006500"
      - "0001564590-15-009381"
      - "0001564590-16-017682"
    note: >
      HubSpot tagged every diluted share count in these three 10-Qs in thousands. Its
      10-K filed 2016-02-24 sits between the second and third of them and is in units,
      which is why this is scoped to the filings rather than to a period.

  - cik: 1372612
    concept: shares_diluted
    multiply_by: 1000
    accessions:
      - "0000950170-23-007573"
    note: >
      Box tagged all three diluted share counts in its 2023 10-K in thousands. Every
      other Box filing, before and after, is in units.

  - cik: 1561550
    concept: shares_diluted
    multiply_by: 1000
    accessions:
      - "0001564590-19-043256"
      - "0001564590-20-006422"
      - "0001564590-21-009770"
    from_period_end: 2019-01-01
    note: >
      Datadog tagged current period diluted share counts in thousands in these three
      filings while leaving the prior year comparatives in the same documents in
      units, so the correction is bounded to periods ending in 2019 or later. None of
      these produced a wrong published value, because a correctly scaled filing won
      on recency each time, but the disagreement is real and would surface the moment
      one of these became the latest word on a period.
