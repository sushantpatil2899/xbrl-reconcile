name: image

# Builds the API image with the current marts inside it and pushes it to the GitHub
# container registry. Chained after transform the same way pages is, and for the same
# reason: the marts are baked into the image, so a new publish means a new image.
#
# The registry is GHCR rather than Azure Container Registry, which has no free tier and
# bills a flat rate per day whether anything is pulled or not. Building here is not a
# compromise either, it is the requirement: the Dockerfile mounts the bucket
# credentials as a BuildKit secret so they touch exactly one layer and are recorded in
# none, and Actions supports that where a platform builder generally does not.
#
# This workflow only publishes the image. Rolling it out to Azure is a separate job, so
# that a daily data refresh can never alter infrastructure Terraform owns.

on:
  workflow_run:
    workflows: [transform]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    # A failed transform may not have published marts at all, and baking whatever is
    # still in the bucket would ship yesterday's figures under today's image. A manual
    # run is always allowed, because that is how a fix gets tested.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # GITHUB_TOKEN rather than a personal token. It is issued for this run, expires
      # with it, and the packages: write permission above is the whole of its authority
      # over the registry.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true

          # Container Apps runs amd64. Stated rather than inherited from the runner, so
          # moving to an arm runner cannot silently produce an image Azure will not run.
          platforms: linux/amd64

          # Two tags with different jobs. The run id is the one deployments reference,
          # because a fixed tag does not change and so cannot produce a new revision.
          # latest is for a human reaching for the image by hand.
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.run_id }}
            ghcr.io/${{ github.repository }}:latest

          build-args: |
            B2_BUCKET=${{ vars.B2_BUCKET }}
            B2_ENDPOINT=${{ vars.B2_ENDPOINT }}
            MARTS_REVISION=${{ github.run_id }}

          secrets: |
            b2_key_id=${{ secrets.B2_INGEST_KEY_ID }}
            b2_key=${{ secrets.B2_INGEST_KEY }}

          # Keeps the dependency install, which is the slow layer, between runs. The
          # marts fetch deliberately sits below a cache key that changes every run, so
          # this speeds the build without ever serving stale data.
          #
          # The cache lives in GHCR rather than in the Actions cache, because the
          # Actions cache refuses writes from this workflow. GitHub grants only
          # read access to the default branch cache scope for triggers it treats as
          # low trust, and workflow_run is named as one of them, so a chained run
          # built the image and then failed exporting the cache with "token has no
          # writable scopes". Manual runs could write and chained runs could not,
          # which is why this passed until the chain first ran on its own.
          #
          # GitHub documents a cache-mode override that would force write access, and
          # also warns that it reintroduces cache poisoning risk for exactly this
          # trigger. A registry cache avoids the question: the run already holds
          # packages: write for the push, GHCR storage and bandwidth are free, and it
          # refreshes on the daily path rather than only when someone runs this by
          # hand. The bucket credentials are a BuildKit secret mount, which is
          # recorded in no layer and so reaches no cache.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max

      # Proof rather than trust. The build can succeed with an image that will not start,
      # and an image that will not start is indistinguishable from a broken deploy later.
      # So run it here, on the runner, and ask it a real question before anything is
      # rolled out.
      # The container's own logs are printed before anything is allowed to fail. Steps
      # run under bash -e, so a failing curl placed above them aborts the step and
      # throws away the only evidence of why the image did not start.
      - name: Check the image actually serves
        run: |
          image="ghcr.io/${{ github.repository }}:${{ github.run_id }}"
          docker run -d --name api -p 8000:8000 "$image"

          answered=
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/healthz >/dev/null 2>&1; then
              answered=$i
              break
            fi
            sleep 1
          done

          echo "--- container state ---"
          docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}}' api || true
          echo "--- container logs ---"
          docker logs api 2>&1 | tail -40 || true
          echo "-----------------------"

          if [ -z "$answered" ]; then
            echo "no answer on /healthz after 40s"
            docker rm -f api >/dev/null || true
            exit 1
          fi

          echo "answered after ${answered}s"
          curl -fsS http://localhost:8000/healthz
          echo
          docker rm -f api >/dev/null

      - name: Report what was published
        run: |
          echo "image:  ghcr.io/${{ github.repository }}:${{ github.run_id }}"
          echo "digest: ${{ steps.build.outputs.digest }}"
