[project]
name = "xbrl-reconcile"
version = "0.1.0"
description = "Reconcile SEC XBRL financial data across companies and years"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.36",
    "dbt-core>=1.12.5",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.5",
    "pyyaml>=6.0",
]

[project.scripts]
xbrl-ingest = "xbrl_reconcile.ingest.run:main"
xbrl-check-ciks = "xbrl_reconcile.ingest.check_ciks:main"
xbrl-ingest-datasets = "xbrl_reconcile.ingest.run_datasets:main"
xbrl-ingest-linkbase = "xbrl_reconcile.ingest.run_linkbase:main"
xbrl-publish-warehouse = "xbrl_reconcile.warehouse:main"
xbrl-fetch-warehouse = "xbrl_reconcile.warehouse:fetch_main"
xbrl-publish-marts = "xbrl_reconcile.publish_marts:main"
xbrl-fetch-marts = "xbrl_reconcile.publish_marts:fetch_main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
