version: 2

models:
  - name: mart_mapping_coverage
    description: >
      What is mapped and what is not, one row per company, concept and fiscal
      year. A worklist for writing config, not a pass or fail check.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cik, concept, fiscal_year]
    columns:
      - name: ticker
        tests: [not_null]
      - name: fiscal_year
        tests: [not_null]
      - name: concept
        tests: [not_null]
      - name: status
        description: >
          reported when the company tagged it, derived when computed from other
          concepts, ambiguous when candidate tags disagreed and we chose,
          no_balance_sheet for a balance sheet concept in the company's earliest
          fiscal year (US rules require three income statements but only two
          balance sheets, so that gap can never be filled), not_applicable for an
          optional concept the company legitimately has none of, missing when
          there is nothing and something could be done about it.
        tests:
          - not_null
          - declared_in_vocabulary:
              arguments:
                vocabulary: coverage_status

  - name: mart_unmapped_tags
    description: >
      Tags a company reports that match no mapping rule, with how many peers use
      them. The raw material for writing new mappings.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cik, taxonomy, tag]
    columns:
      - name: ticker
        tests: [not_null]
      - name: tag
        tests: [not_null]
      - name: facts
        tests: [not_null]
      - name: peers_using
        description: How many of the configured companies report this tag.
        tests: [not_null]
