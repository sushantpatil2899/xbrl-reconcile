version: 2

models:
  - name: stg_tag_mappings
    description: >
      One row per canonical concept and candidate tag. Order within a concept is
      given by priority: the lowest priority tag a company reports wins.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [concept, taxonomy, tag]
    columns:
      - name: concept
        tests: [not_null]
      - name: statement
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["income_statement", "balance_sheet", "cash_flow"]
      - name: unit
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["USD", "USD/shares", "shares"]
      - name: is_additive
        description: >
          Whether the concept's periods can be added or subtracted. False for a
          ratio or an average, which is why a quarter cannot be derived from one.
        tests: [not_null]
      - name: taxonomy
        tests: [not_null]
      - name: tag
        tests: [not_null]
      - name: priority
        tests: [not_null]
      - name: confidence
        description: What the mapping is based on, never a verified fact about the filing.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["high", "medium", "low"]

  - name: stg_tag_overrides
    description: Per company exceptions to the global mapping order.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cik, concept, mode, taxonomy, tag]
    columns:
      - name: cik
        description: Must be a configured company, or the override silently does nothing.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_companies')
                field: cik
      - name: concept
        description: Must be a mapped concept, or the override silently does nothing.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tag_mappings')
                field: concept
      - name: mode
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["prefer", "ignore"]
      - name: confidence
        description: >
          Confidence for a tag this override introduces. Defaults to low,
          because a tag used for one company is a weaker claim than a sector
          wide standard tag.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["high", "medium", "low"]
      - name: taxonomy
        tests: [not_null]
      - name: tag
        tests: [not_null]
