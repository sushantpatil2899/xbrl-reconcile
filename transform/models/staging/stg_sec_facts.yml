version: 2

models:
  - name: stg_companies
    description: Company config loaded from config/companies.yml through a seed.
    columns:
      - name: cik
        description: SEC's permanent company identifier.
        tests: [unique, not_null]
      - name: ticker
        tests: [unique, not_null]

  - name: stg_sec_facts
    description: >
      One row per fact as reported, from the newest raw snapshot per company.
      No deduplication: a business key repeats once per filing that reported it.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - cik
            - taxonomy
            - concept
            - unit
            - period_start
            - period_end
            - accession
    columns:
      # Structural columns. A failure here means the transformation itself is
      # wrong, so every company is suspect and the build must stop.
      - name: cik
        tests: [not_null]
      - name: taxonomy
        tests: [not_null]
      - name: concept
        tests: [not_null]
      - name: unit
        tests: [not_null]
      - name: period_end
        tests: [not_null]
      - name: period_type
        tests:
          - accepted_values:
              values: ["instant", "duration"]

      # Data quality columns. A failure here means one company's data is odd,
      # which should not block the other companies from publishing. The rows are
      # kept, marked is_valid false, and excluded downstream.
      - name: ticker
        description: Null means a file arrived for a company not in config.
        tests:
          - not_null:
              config:
                severity: warn
      - name: value
        tests:
          - not_null:
              config:
                severity: warn
      - name: accession
        tests:
          - not_null:
              config:
                severity: warn
      - name: filed_date
        tests:
          - not_null:
              config:
                severity: warn

      - name: is_valid
        description: >
          False when the row failed a data quality rule. Downstream models
          filter on this; staging keeps the row so it stays countable.
        tests: [not_null]
