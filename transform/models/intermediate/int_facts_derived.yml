version: 2

models:
  - name: int_facts_derived
    description: >
      Concepts computed from accounting identities for companies that never
      report them, one row per company, concept and period. Computed from
      resolved values, so a derived value always agrees with the published
      inputs it came from.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cik, concept, period_start, period_end]
    columns:
      - name: cik
        tests: [not_null]
      - name: concept
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["gross_profit", "operating_expenses", "total_liabilities"]
      - name: value
        tests: [not_null]
      - name: originally_reported_value
        description: The same identity applied to the inputs' originally reported values.
        tests: [not_null]
      - name: source_tag
        description: The identity used, for example derived:revenue-cost_of_revenue.
        tests: [not_null]
      - name: confidence
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["derived"]
      - name: inputs_confidence
        description: The weakest confidence among the inputs.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["high", "medium", "low"]
      - name: was_restated
        description: True when any input was restated.
        tests: [not_null]
