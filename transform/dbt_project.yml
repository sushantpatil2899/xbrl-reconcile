name: xbrl_reconcile
version: "1.0.0"
profile: xbrl_reconcile

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"

vars:
  # Where the ingestion layer lands raw SEC files. Defaults to the bucket;
  # set RAW_ROOT to a local folder for development without credentials.
  raw_root: "{{ env_var('RAW_ROOT', 's3://' ~ env_var('B2_BUCKET', 'unset') ~ '/raw') }}"

  # How stale the pipeline may get before it warns, then before it fails.
  freshness_warn_days: 3
  freshness_error_days: 14

  # How far two candidate tags may differ before the disagreement counts,
  # expressed as a fraction: companies differ in scale by orders of magnitude.
  candidate_tolerance: 0.001

  # How far two filings may differ before it counts as a restatement rather than
  # the same figure reported again. Also a fraction.
  restatement_tolerance: 0.001

  # How many days a fiscal year end may drift before a period stops matching it.
  # A 52/53 week year moves its end by a few days each year.
  year_end_tolerance_days: 15

  # How far a declared part may sit from the total it is declared a part of and still
  # count as the same figure. A fraction, like the tolerances above, but four orders
  # of magnitude tighter, and for a different reason: those absorb genuine
  # disagreement between filings, while this one only absorbs float error in a sum of
  # whole dollars. At 0.001 it swallowed CrowdStrike's 500,000 noncontrolling
  # interest, which is 0.07 percent of its equity and a real line on the statement,
  # not noise. The question here is whether a part equals its total, so the answer has
  # to mean equal.
  separation_tolerance: 0.000001

  # How far net income may sit from diluted EPS times diluted shares before it is a
  # scale error rather than an accounting difference, expressed as a multiple of the
  # EPS rounding allowance. Deliberately loose: the identity legitimately fails for
  # pre IPO companies, whose EPS is computed on income attributable to common
  # stockholders after preferred accretion, and Figma's 2023 misses by 464 times.
  # 500, 1000 and 5000 all isolate the same six genuine errors.
  share_scale_threshold: 1000

  # How far a financial statement identity may be out before it is worth
  # reporting. Looser than the others: companies round to thousands and real
  # statements carry small reconciling items.
  consistency_tolerance: 0.01

models:
  xbrl_reconcile:
    staging:
      +materialized: table
    intermediate:
      +materialized: table
    marts:
      +materialized: table

data_tests:
  xbrl_reconcile:
    # Keep the rows that failed a test, so "3 rows failed" can be investigated.
    +store_failures: true
    +schema: test_failures
